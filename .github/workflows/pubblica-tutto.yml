name: Pubblica tutte le bozze

on:
  push:
    branches:
      - main
    paths:
      - content/pubblicazione.json

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pubblica-tutto
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Raccoglie e unisce tutte le bozze del pannello
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t bozze < <(
            gh pr list \
              --state open \
              --base main \
              --limit 100 \
              --json number,headRefName \
              --jq '.[] | select(.headRefName | startswith("cms/")) | .number'
          )

          for bozza in "${bozze[@]}"; do
            gh pr merge "$bozza" --merge --delete-branch
          done

      - name: Prepara l'unica pubblicazione Netlify
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          git checkout main
          git reset --hard origin/main
          printf '%s run-%s-%s\n' \
            "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            "$GITHUB_RUN_ID" \
            "$GITHUB_RUN_ATTEMPT" \
            > .netlify-publish

          git config user.name "pubblica-tutto[bot]"
          git config user.email "pubblica-tutto[bot]@users.noreply.github.com"
          git add .netlify-publish
          git commit -m "Pubblica tutte le modifiche del pannello"
          git push origin main
