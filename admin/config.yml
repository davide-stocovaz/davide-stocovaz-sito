backend:
  name: turbo-github
  turbo_site_id: aac7e018-5b45-407e-b3fe-96a55d185683
  branch: main

publish_mode: editorial_workflow
locale: it
media_folder: assets/uploads
public_folder: /assets/uploads

collections:
  - name: catalogo
    label: Contenuti del sito
    files:
      - name: libri
        label: Libri
        file: content/libri.json
        format: json
        fields:
          - name: books
            label: Libri
            label_singular: Libro
            widget: list
            allow_reorder: true
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: Titolo, widget: string }
              - { name: genre, label: Genere, widget: string, required: false }
              - { name: cover, label: Copertina, widget: image }
              - { name: tagline, label: Frase di lancio, widget: text }
              - { name: description, label: Trama, widget: text }
              - { name: publisher, label: Editore, widget: string, required: false }
              - { name: year, label: Anno, widget: number, value_type: int, required: false }
              - { name: series, label: Collana, widget: string, required: false }
              - { name: release, label: Uscita mostrata sul sito, widget: string, required: false, hint: "Per esempio: 26/05/2026 (riedizione)." }
              - { name: publication_date, label: Data per stabilire l'ultima uscita, widget: datetime, date_format: "YYYY-MM-DD", picker_utc: true, hint: "Serve soltanto per mostrare automaticamente in Home il libro più recente." }
              - name: formats
                label: Formati
                widget: list
                required: false
                field: { name: format, label: Formato, widget: string }
              - { name: pages, label: Pagine, widget: number, value_type: int, required: false }
              - { name: isbn, label: ISBN, widget: string, required: false }
              - { name: purchase_url, label: Collegamento per acquistarlo, widget: string, required: false, hint: "Deve iniziare con https://" }
              - name: reviews
                label: Recensioni
                label_singular: Recensione
                widget: list
                required: false
                summary: "{{fields.source}}"
                fields:
                  - { name: quote, label: Testo della recensione, widget: text }
                  - { name: source, label: Autore o testata, widget: string }
                  - { name: url, label: Collegamento facoltativo, widget: string, required: false, hint: "Se lo inserisci, deve iniziare con https://" }

      - name: poesie
        label: Poesie
        file: content/poesie.json
        format: json
        fields:
          - name: poems
            label: Poesie
            label_singular: Poesia
            widget: list
            allow_reorder: true
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: Titolo, widget: string }
              - { name: text, label: Testo, widget: text }
              - { name: featured, label: Mostra nella Home, widget: boolean, default: false }

      - name: racconti
        label: Racconti
        file: content/racconti.json
        format: json
        fields:
          - name: stories
            label: Racconti
            label_singular: Racconto
            widget: list
            allow_reorder: true
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: Titolo, widget: string }
              - { name: text, label: Testo completo, widget: text }
              - { name: featured, label: Mostra nella Home, widget: boolean, default: false }

      - name: introduzioni
        label: Testi introduttivi
        file: content/testi.json
        format: json
        fields:
          - { name: home, label: Introduzione della Home, widget: text }
          - { name: books, label: Introduzione della pagina Libri, widget: text }
          - { name: poems, label: Introduzione della pagina Poesie, widget: text }
          - { name: stories, label: Introduzione della pagina Racconti, widget: text }
          - { name: biography, label: Introduzione della pagina Biografia, widget: text }
          - { name: contacts, label: Introduzione della pagina Contatti, widget: text }

      - name: autore
        label: Biografia e social
        file: content/autore.json
        format: json
        fields:
          - { name: biography, label: Biografia, widget: text }
          - { name: facebook, label: Nome Facebook, widget: string, required: false }
          - { name: facebook_url, label: Collegamento Facebook, widget: string, required: false, hint: "Deve iniziare con https://" }
          - { name: instagram, label: Nome Instagram, widget: string, required: false }
          - { name: instagram_url, label: Collegamento Instagram, widget: string, required: false, hint: "Deve iniziare con https://" }
          - { name: tiktok, label: Nome TikTok, widget: string, required: false }
          - { name: tiktok_url, label: Collegamento TikTok, widget: string, required: false, hint: "Deve iniziare con https://" }

      - name: pubblicazione
        label: "PUBBLICA TUTTO"
        file: content/pubblicazione.json
        format: json
        fields:
          - name: richiesta
            label: Avvia la pubblicazione
            widget: boolean
            hint: "Cambia la posizione dell'interruttore, salva la bozza e poi pubblicala. Il sistema raccoglierà tutte le altre bozze e aggiornerà il sito una sola volta."
